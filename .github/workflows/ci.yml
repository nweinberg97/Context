name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:54322/postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:54322/context_e2e
      CONTEXT_ALLOW_LOCAL_AUTH: "true"
      LOCAL_AUTH_SECRET: ci-local-auth-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Switch to `npm ci` once package-lock.json is committed (first `npm install` creates it).
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
