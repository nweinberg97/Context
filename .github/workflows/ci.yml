name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:54322/postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:54322/context_e2e
      CONTEXT_ALLOW_LOCAL_AUTH: "true"
      LOCAL_AUTH_SECRET: ci-local-auth-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Switch to `npm ci` once package-lock.json is committed (first `npm install` creates it).
      - run: npm install
      - run: bash scripts/ci-step.sh "typecheck" npm run typecheck
      - run: bash scripts/ci-step.sh "lint" npm run lint
      - run: bash scripts/ci-step.sh "test:unit" npm run test:unit
      - run: bash scripts/ci-step.sh "test:db" npm run test:db
      - run: bash scripts/ci-step.sh "build" npm run build
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci-step.sh "test:e2e" npm run test:e2e
      - name: Fail if any step failed
        run: |
          if [ -f "$RUNNER_TEMP/ci-failed-steps" ]; then echo "Failed: $(paste -sd, "$RUNNER_TEMP/ci-failed-steps")"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
